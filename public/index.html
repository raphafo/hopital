<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion hospitalière</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f7fa; color: #1b2a3a; }
    main { text-align: center; padding: 2rem; }
    .badge { display: inline-block; padding: .3rem .8rem; border-radius: 999px; background: #ddd; font-size: .9rem; }
    .ok { background: #cdeed7; } .ko { background: #f6d0d0; }
  </style>
</head>
<body>
  <main>
    <h1>Gestion hospitalière</h1>
    <p>Projet en construction.</p>
    <p><a href="auth.html">Connexion / Inscription</a></p>
    <p>API : <span id="api" class="badge">…</span> &nbsp; Base de données : <span id="db" class="badge">…</span></p>
  </main>
  <script>
    async function verifier(url, id) {
      const el = document.getElementById(id);
      try {
        const r = await fetch(url);
        el.textContent = r.ok ? 'OK' : 'Erreur';
        el.className = 'badge ' + (r.ok ? 'ok' : 'ko');
      } catch { el.textContent = 'Erreur'; el.className = 'badge ko'; }
    }
    verifier('/api/health', 'api');
    verifier('/api/health/db', 'db');
  </script>
</body>
</html>
