<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion – Gestion hospitalière</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/gestion.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <div id="vue-chargement" class="text-center text-muted py-5">Chargement…</div>

    <div id="vue-gestion" class="d-none">

      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h1 class="h3 mb-0">Gestion</h1>
        <a href="#" class="btn btn-principal d-none" id="btn-nouveau">Nouveau</a>
      </div>

      <div id="alerte-gestion" class="alert d-none" role="alert"></div>

      <!-- Navigation entre les contenus -->
      <ul class="nav nav-pills mb-3" id="onglets">
        <li class="nav-item"><button type="button" class="nav-link active" data-onglet="medecins">Médecins</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-onglet="patients">Patients</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-onglet="rdv">Rendez-vous</button></li>
      </ul>

      <!-- Recherche, filtres et mode d'affichage -->
      <div class="card barre-filtres mb-3"><div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-lg-4">
            <label for="recherche" class="form-label small mb-1">Recherche</label>
            <input type="search" class="form-control" id="recherche" placeholder="Rechercher…">
          </div>

          <div class="col-12 col-lg-6" data-filtres="medecins">
            <div class="row g-2">
              <div class="col-6">
                <label for="f-specialite" class="form-label small mb-1">Spécialité</label>
                <select class="form-select" id="f-specialite" name="specialite"><option value="">Toutes</option></select>
              </div>
              <div class="col-6">
                <label for="f-disponible" class="form-label small mb-1">Disponibilité</label>
                <select class="form-select" id="f-disponible" name="disponible">
                  <option value="">Toutes</option><option value="true">Disponibles</option><option value="false">Indisponibles</option>
                </select>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-6 d-none" data-filtres="patients">
            <div class="row g-2">
              <div class="col-4">
                <label for="f-sexe" class="form-label small mb-1">Sexe</label>
                <select class="form-select" id="f-sexe" name="sexe"><option value="">Tous</option><option value="F">Féminin</option><option value="M">Masculin</option></select>
              </div>
              <div class="col-4">
                <label for="f-groupe" class="form-label small mb-1">Groupe sanguin</label>
                <select class="form-select" id="f-groupe" name="groupe">
                  <option value="">Tous</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                  <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                </select>
              </div>
              <div class="col-4">
                <label for="f-assure" class="form-label small mb-1">Assurance</label>
                <select class="form-select" id="f-assure" name="assure"><option value="">Toutes</option><option value="true">Assurés</option><option value="false">Non assurés</option></select>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-6 d-none" data-filtres="rdv">
            <div class="row g-2">
              <div class="col-6 col-md-3">
                <label for="f-statut" class="form-label small mb-1">Statut</label>
                <select class="form-select" id="f-statut" name="statut">
                  <option value="">Tous</option><option value="planifie">Planifié</option><option value="termine">Terminé</option><option value="annule">Annulé</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label for="f-medecin" class="form-label small mb-1">Médecin</label>
                <select class="form-select" id="f-medecin" name="medecin_id"><option value="">Tous</option></select>
              </div>
              <div class="col-6 col-md-3">
                <label for="f-debut" class="form-label small mb-1">Du</label>
                <input type="date" class="form-control" id="f-debut" name="date_debut">
              </div>
              <div class="col-6 col-md-3">
                <label for="f-fin" class="form-label small mb-1">Au</label>
                <input type="date" class="form-control" id="f-fin" name="date_fin">
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-2">
            <button type="button" class="btn btn-outline-secondary w-100" id="btn-reinitialiser">Réinitialiser</button>
          </div>
        </div>
      </div></div>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small" id="compteur"></span>
        <div class="btn-group" id="bascule-vue" role="group" aria-label="Mode d'affichage">
          <button type="button" class="btn btn-sm btn-principal" data-vue="cartes">Cartes</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-vue="tableau">Tableau</button>
        </div>
      </div>

      <div id="resultats"></div>
      <nav class="mt-3" aria-label="Pagination"><ul class="pagination justify-content-center flex-wrap" id="pagination"></ul></nav>
    </div>
  </main>

  <!-- Fenêtre de détail -->
  <div class="modal fade" id="modal-detail" tabindex="-1" aria-labelledby="titre-detail" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="titre-detail">Détail</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
      <div class="modal-body" id="corps-detail"></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button></div>
    </div></div>
  </div>

  <!-- Fenêtre de confirmation -->
  <div class="modal fade" id="modal-confirmation" tabindex="-1" aria-labelledby="titre-confirmation" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="titre-confirmation">Confirmation</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
      <div class="modal-body" id="message-confirmation"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Retour</button>
        <button type="button" class="btn btn-danger" id="btn-confirmer">Confirmer</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/gestion.js"></script>
</body>
</html>
